name: wifi_verifier_app
description: "A Flutter project for WiFi and ESP32 verification."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Networking and Wi-Fi info
  http: ^1.2.0
  network_info_plus: ^6.0.1
  permission_handler: ^11.3.1 

  # Crypto and ASN.1
  pointycastle: ^3.9.1
  basic_utils: ^5.7.0
  asn1lib: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/authority_public.pem
    - assets/device_cert.json
